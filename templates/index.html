{% extends "base.html" %}

{% block content %}
  <p>Hello, {{ name }}!</p>

  <h2>Tickets in the queue</h2>
  <ul class="tickets">
    {% for t in tickets %}
      <li><a href="{{ url_for('ticket', ticket_id=t.ticket_number) }}">#{{ t.ticket_number }} - {{ t.name }}</a></li>
    {% else %}
      <li>The queue is empty.</li>
    {% endfor %}
  </ul>
{% endblock %}
