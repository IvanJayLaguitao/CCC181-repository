services:
  db:
    image: postgres:17
    container_name: klinikaq-db
    environment:
      POSTGRES_USER: klinikaq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: klinikaq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klinikaq -d klinikaq"]
      interval: 5s
      timeout: 3s
      retries: 10
      
volumes:
  pgdata: